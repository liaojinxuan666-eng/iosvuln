[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iosvuln"
version = "0.1.0"
description = "iOS kernel-driver (kext) static + hook vulnerability analysis pipeline"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
r2 = ["r2pipe>=1.6.0"]

[project.scripts]
iosvuln = "iosvuln.cli:main"

[tool.setuptools]
packages = ["iosvuln"]
