name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1)'
        required: true
        default: 'v0.1.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build debs and publish release
    runs-on: macos-15
    env:
      THEOS_PACKAGE_SCHEME: rootless
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: brew install dpkg ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK
        run: rm -rf "$HOME/theos/sdks" && git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"

      - name: Show toolchain
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS/sdks" | tail -5
          which dpkg-deb

      - name: Build extractive tweak deb
        working-directory: templates/ellekit
        run: make package FINALPACKAGE=1

      - name: Build collector deb
        run: bash packaging/build_deb.sh

      - name: Build on-device analyzer deb
        run: bash packaging/build_analyze_deb.sh

      - name: Package analysis tool source
        run: |
          mkdir -p release
          git ls-files -z | xargs -0 zip -q release/iosvuln-source.zip

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp templates/ellekit/packages/*.deb dist/ 2>/dev/null || true
          cp packaging/*.deb dist/ 2>/dev/null || true
          cp release/*.zip dist/ 2>/dev/null || true
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: iosvuln ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
